[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xdnatop"
version = "0.1.0"
description = "nvtop-like terminal monitor for AMD XDNA NPUs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eurasia32" }]
keywords = ["amd", "npu", "xdna", "ryzen-ai", "nvtop", "monitor"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.scripts]
xdnatop = "xdnatop.cli:main"

[tool.setuptools]
packages = ["xdnatop"]

[project.optional-dependencies]
dev = ["ruff", "build"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
